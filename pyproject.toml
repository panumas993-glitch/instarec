[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instarec"
version = "1.8.0"
authors = [
  { name="qwer-lives", email="primary@qwerlives.com" },
]
description = "A tool to download Instagram live streams."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "aiohttp",
    "aiohttp_socks",
    "aiofiles",
    "lxml",
    "tqdm",
    "platformdirs",
    "curl_cffi",
]

[project.optional-dependencies]
instagram = [
    "instagrapi",
    "PySocks",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
instarec = "instarec.cli:main_entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["instarec*"]